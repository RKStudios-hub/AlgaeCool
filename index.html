<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Algae Cool</title>
<style>
  :root {
    --bg: #0a0a0c;
    --fg: #f5f5f7;
    --muted: #8e8e98;
    --accent: #e8b4b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem 1rem;
    text-align: center;
  }
  .wrap {
    width: 100%;
    max-width: 960px;
  }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0 0 0.35rem;
  }
  p.sub {
    margin: 0 0 1.75rem;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .frame {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
    line-height: 0;
  }
  video {
    display: block;
    width: 100%;
    height: auto;
  }
  .fallback {
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .fallback a { color: var(--accent); }
  footer {
    color: var(--muted);
    font-size: 0.8rem;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Algae Cool</h1>
    <p class="sub">Made with Clipchamp</p>

    <div class="frame">
      <video
        src="/outro.mp4"
        controls
        autoplay
        loop
        muted
        playsinline
        preload="auto"
        poster="">
      >
        Your browser does not support the video tag.
        <a href="/outro.mp4">Download the video instead.</a>
      </video>
    </div>

    <noscript>
      <p class="fallback">
        JavaScript is disabled.
        <a href="/outro.mp4">Download the video instead.</a>
      </p>
    </noscript>

    <footer>
      <a href="/outro.mp4" download>Download MP4</a>
    </footer>
  </div>
</body>
</html>
